<!DOCTYPE html>
<!-- GitHub Pages向け静的HTML。ビルドツール・初期店舗データ不要。 -->
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f4ee" />
  <title>買物メモ</title>
  <style>
    :root{
      --bg:#f6f4ee;
      --card:#ffffff;
      --ink:#1f2933;
      --sub:#667085;
      --line:#dedbd3;
      --accent:#1f6f5f;
      --accent-soft:#e5f2ee;
      --danger:#b42318;
      --shadow:0 8px 24px rgba(37, 43, 48, .08);
      --radius:18px;
    }
    *{box-sizing:border-box}
    html{font-size:16px}
    body{
      margin:0;
      color:var(--ink);
      background:var(--bg);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
      -webkit-tap-highlight-color:transparent;
    }
    button,input{font:inherit}
    button{cursor:pointer}
    .app{
      width:min(760px,100%);
      margin:0 auto;
      min-height:100vh;
      padding:18px 16px 104px;
    }
    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin:2px 0 18px;
    }
    h1{
      margin:0;
      font-size:1.65rem;
      letter-spacing:.02em;
    }
    .count-badge{
      min-width:46px;
      text-align:center;
      padding:8px 12px;
      border-radius:999px;
      background:var(--accent-soft);
      color:var(--accent);
      font-weight:800;
    }
    .panel{
      background:var(--card);
      border:1px solid rgba(0,0,0,.04);
      box-shadow:var(--shadow);
      border-radius:var(--radius);
      padding:18px;
      margin-bottom:16px;
    }
    .screen{display:none}
    .screen.active{display:block}
    .section-title{
      margin:0 0 12px;
      font-size:1.12rem;
    }
    .muted{color:var(--sub);line-height:1.7}
    .store-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:12px;
    }
    .store-card{
      appearance:none;
      border:1px solid var(--line);
      background:#fff;
      color:var(--ink);
      border-radius:16px;
      padding:18px 14px;
      text-align:left;
      min-height:102px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      gap:10px;
    }
    .store-card:active{transform:scale(.985)}
    .store-name{
      font-weight:800;
      font-size:1.08rem;
      overflow-wrap:anywhere;
    }
    .store-count{
      color:var(--accent);
      font-weight:800;
    }
    .empty{
      text-align:center;
      padding:32px 18px;
      color:var(--sub);
      line-height:1.8;
    }
    .toolbar{
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:14px;
    }
    .back-btn,.icon-btn{
      border:1px solid var(--line);
      background:#fff;
      color:var(--ink);
      border-radius:12px;
      min-height:44px;
      padding:0 14px;
      font-weight:700;
    }
    .toolbar h2{
      margin:0;
      font-size:1.3rem;
      overflow-wrap:anywhere;
    }
    .shopping-list{
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .item-row{
      display:grid;
      grid-template-columns:52px minmax(0,1fr) 44px;
      align-items:center;
      gap:10px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:16px;
      padding:12px;
    }
    .check-btn{
      width:50px;
      height:50px;
      border-radius:15px;
      border:2px solid var(--accent);
      background:var(--accent-soft);
      color:var(--accent);
      font-size:1.35rem;
      font-weight:900;
    }
    .item-name{
      font-size:1.12rem;
      font-weight:800;
      line-height:1.35;
      overflow-wrap:anywhere;
    }
    .item-stores{
      display:flex;
      flex-wrap:wrap;
      gap:5px;
      margin-top:7px;
    }
    .mini-tag{
      font-size:.78rem;
      padding:4px 8px;
      border-radius:999px;
      background:#f1f3f5;
      color:#475467;
    }
    .more-btn{
      width:42px;height:42px;
      border:none;
      background:transparent;
      border-radius:12px;
      font-size:1.35rem;
      color:var(--sub);
    }
    label{
      display:block;
      margin:0 0 8px;
      font-weight:800;
      font-size:1.02rem;
    }
    .big-input{
      width:100%;
      min-height:58px;
      padding:14px 16px;
      border:2px solid var(--line);
      border-radius:15px;
      background:#fff;
      color:var(--ink);
      font-size:1.12rem;
      outline:none;
    }
    .big-input:focus{border-color:var(--accent)}
    .field{margin-bottom:20px;position:relative}
    .suggestions{
      position:absolute;
      z-index:20;
      left:0;right:0;
      top:calc(100% + 4px);
      background:#fff;
      border:1px solid var(--line);
      border-radius:14px;
      box-shadow:var(--shadow);
      overflow:hidden;
      max-height:240px;
      overflow-y:auto;
    }
    .suggestions.hidden{display:none}
    .suggestion{
      width:100%;
      border:0;
      border-bottom:1px solid #eee;
      background:#fff;
      text-align:left;
      padding:14px 16px;
      font-size:1.02rem;
    }
    .suggestion:last-child{border-bottom:0}
    .chips{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }
    .chip{
      border:1px solid var(--line);
      background:#fff;
      color:var(--ink);
      border-radius:999px;
      min-height:46px;
      padding:10px 16px;
      font-weight:700;
    }
    .chip.selected{
      background:var(--accent);
      color:#fff;
      border-color:var(--accent);
    }
    .inline{
      display:flex;
      gap:10px;
      align-items:stretch;
    }
    .inline .big-input{flex:1;min-width:0}
    .add-inline{
      border:0;
      border-radius:14px;
      min-width:86px;
      padding:0 16px;
      background:#2f3a44;
      color:#fff;
      font-weight:800;
    }
    .primary{
      width:100%;
      min-height:62px;
      border:0;
      border-radius:16px;
      background:var(--accent);
      color:#fff;
      font-size:1.14rem;
      font-weight:900;
      box-shadow:0 8px 18px rgba(31,111,95,.22);
    }
    .primary:disabled{opacity:.45;box-shadow:none}
    .store-manage-row{
      display:grid;
      grid-template-columns:44px minmax(0,1fr) auto auto;
      align-items:center;
      gap:8px;
      padding:12px 0;
      border-bottom:1px solid #eceae5;
    }
    .store-manage-row:last-child{border-bottom:0}
    .store-manage-name{font-weight:800;overflow-wrap:anywhere}

    .drag-handle{
      width:42px;
      height:42px;
      border:1px solid var(--line);
      background:#fff;
      border-radius:10px;
      font-size:1.25rem;
      color:var(--sub);
      cursor:grab;
      touch-action:none;
      user-select:none;
    }
    .drag-handle:active{cursor:grabbing}
    .store-manage-row.dragging{
      opacity:.55;
      background:var(--accent-soft);
      border-radius:12px;
    }
    .store-manage-row.drag-over{
      outline:2px dashed var(--accent);
      outline-offset:2px;
    }

    .small-btn{
      border:1px solid var(--line);
      background:#fff;
      border-radius:10px;
      padding:9px 11px;
      font-weight:700;
    }
    .danger{color:var(--danger)}
    .bottom-nav{
      position:fixed;
      z-index:50;
      left:50%;
      transform:translateX(-50%);
      bottom:0;
      width:min(760px,100%);
      display:grid;
      grid-template-columns:repeat(4,1fr);
      background:rgba(255,255,255,.96);
      border-top:1px solid var(--line);
      padding:7px 8px calc(7px + env(safe-area-inset-bottom));
      backdrop-filter:blur(14px);
    }
    .nav-btn{
      border:0;
      background:transparent;
      color:#667085;
      border-radius:12px;
      padding:9px 4px;
      font-size:.78rem;
      font-weight:800;
    }
    .nav-icon{display:block;font-size:1.25rem;margin-bottom:3px}
    .nav-btn.active{background:var(--accent-soft);color:var(--accent)}
    .fab{
      position:fixed;
      right:max(18px,calc((100vw - 760px)/2 + 18px));
      bottom:92px;
      width:62px;height:62px;
      border:0;
      border-radius:50%;
      background:var(--accent);
      color:#fff;
      font-size:2rem;
      box-shadow:0 10px 24px rgba(31,111,95,.3);
      z-index:40;
    }
    .toast{
      position:fixed;
      z-index:100;
      left:50%;
      transform:translateX(-50%);
      bottom:96px;
      width:min(520px,calc(100% - 32px));
      background:#25313a;
      color:#fff;
      border-radius:14px;
      padding:12px 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      box-shadow:var(--shadow);
    }
    .toast.hidden{display:none}
    .toast button{
      border:0;
      background:#fff;
      color:#25313a;
      border-radius:9px;
      padding:8px 12px;
      font-weight:900;
    }
    dialog{
      width:min(520px,calc(100% - 28px));
      border:0;
      border-radius:18px;
      padding:0;
      box-shadow:0 18px 60px rgba(0,0,0,.25);
    }
    dialog::backdrop{background:rgba(0,0,0,.35)}
    .dialog-body{padding:20px}
    .dialog-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:18px;
    }
    .secondary{
      min-height:50px;
      border:1px solid var(--line);
      border-radius:13px;
      background:#fff;
      font-weight:800;
    }
    .dialog-actions .primary{min-height:50px;font-size:1rem}
    .data-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media (max-width:430px){
      .store-grid{grid-template-columns:1fr}
      .store-card{min-height:88px}
      .app{padding-left:12px;padding-right:12px}
      .panel{padding:16px}
      .data-actions{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1>買物メモ</h1>
    <div class="count-badge" id="headerCount">0件</div>
  </header>

  <section id="homeScreen" class="screen active">
    <div class="panel">
      <h2 class="section-title">お店を選ぶ</h2>
      <div id="storeGrid" class="store-grid"></div>
      <div id="noStoreHome" class="empty" hidden>
        まず「店舗管理」から、いつも行くお店を登録してください。
      </div>
    </div>
  </section>

  <section id="storeScreen" class="screen">
    <div class="toolbar">
      <button class="back-btn" id="backHome">← 戻る</button>
      <h2 id="storeScreenTitle"></h2>
    </div>
    <div id="storeItems" class="shopping-list"></div>
    <div id="storeEmpty" class="panel empty" hidden>
      このお店で買うものはありません。
    </div>
  </section>

  <section id="allScreen" class="screen">
    <div class="panel">
      <h2 class="section-title">すべての買物</h2>
      <p class="muted">同じ商品が複数店舗に登録されていても、ここでは1件として表示します。</p>
    </div>
    <div id="allItems" class="shopping-list"></div>
    <div id="allEmpty" class="panel empty" hidden>
      買物メモはまだありません。
    </div>
  </section>

  <section id="addScreen" class="screen">
    <div class="panel">
      <h2 class="section-title" id="formTitle">買うものを登録</h2>

      <div class="field">
        <label for="itemName">商品名</label>
        <input id="itemName" class="big-input" type="text" autocomplete="off" placeholder="例：ゴミ袋" />
        <div id="itemSuggestions" class="suggestions hidden"></div>
      </div>

      <div class="field">
        <label>売っているお店（複数選択可）</label>
        <div id="storeChips" class="chips"></div>
        <p id="noStoreForm" class="muted" hidden>店舗がありません。下の欄から追加してください。</p>
      </div>

      <div class="field">
        <label for="newStoreName">イレギュラーな店舗を追加</label>
        <div class="inline">
          <input id="newStoreName" class="big-input" type="text" autocomplete="off" placeholder="店舗名を入力" />
          <button id="addStoreInline" class="add-inline">追加</button>
        </div>
        <div id="storeSuggestions" class="suggestions hidden"></div>
      </div>

      <button id="saveItem" class="primary" disabled>登録する</button>
    </div>
  </section>

  <section id="settingsScreen" class="screen">
    <div class="panel">
      <h2 class="section-title">店舗管理</h2>
      <div class="inline">
        <input id="manageStoreInput" class="big-input" type="text" placeholder="いつものお店を追加" />
        <button id="manageStoreAdd" class="add-inline">追加</button>
      </div>
      <div id="manageStoreList" style="margin-top:14px"></div>
    </div>

    <div class="panel">
      <h2 class="section-title">データ管理</h2>
      <div class="data-actions">
        <button id="saveBackupBtn" class="secondary">現在の状態をバックアップ</button>
        <button id="restoreBackupBtn" class="secondary">バックアップから復元</button>
      </div>
      <p id="backupStatus" class="muted" style="margin-bottom:0"></p>
      <p class="muted" style="margin-bottom:0">バックアップは端末内に1件だけ保存され、作成するたびに前回分を上書きします。</p>
    </div>
  </section>
</div>

<button class="fab" id="fab" aria-label="買物を追加">＋</button>

<nav class="bottom-nav">
  <button class="nav-btn active" data-screen="homeScreen"><span class="nav-icon">🏬</span>店舗別</button>
  <button class="nav-btn" data-screen="allScreen"><span class="nav-icon">📝</span>すべて</button>
  <button class="nav-btn" data-screen="addScreen"><span class="nav-icon">＋</span>登録</button>
  <button class="nav-btn" data-screen="settingsScreen"><span class="nav-icon">⚙</span>店舗管理</button>
</nav>

<div id="toast" class="toast hidden">
  <span id="toastText"></span>
  <button id="undoBtn">元に戻す</button>
</div>

<dialog id="editDialog">
  <div class="dialog-body">
    <h2 class="section-title">買物メモを編集</h2>
    <div class="field">
      <label for="editName">商品名</label>
      <input id="editName" class="big-input" type="text" />
    </div>
    <div class="field">
      <label>売っているお店</label>
      <div id="editStoreChips" class="chips"></div>
    </div>
    <div class="dialog-actions">
      <button id="deleteItemBtn" class="secondary danger">削除</button>
      <button id="updateItemBtn" class="primary">保存</button>
    </div>
    <button id="closeDialogBtn" class="secondary" style="width:100%;margin-top:10px">閉じる</button>
  </div>
</dialog>

<script>
(() => {
  const STORAGE_KEY = 'shopping-memo-store-list-v1';
  const BACKUP_KEY = 'shopping-memo-store-list-backup-v1';


  const defaultData = {
    stores: [],
    items: [],
    itemHistory: [],
    storeHistory: []
  };

  let data = loadData();
  let currentStoreId = null;
  let selectedStoreIds = new Set();
  let editingItemId = null;
  let lastRemoved = null;
  let toastTimer = null;

  const $ = (id) => document.getElementById(id);

  function loadData(){
    try{
      const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if(!parsed) return structuredClone(defaultData);
      return {
        stores: Array.isArray(parsed.stores) ? parsed.stores : [],
        items: Array.isArray(parsed.items) ? parsed.items : [],
        itemHistory: Array.isArray(parsed.itemHistory) ? parsed.itemHistory : [],
        storeHistory: Array.isArray(parsed.storeHistory) ? parsed.storeHistory : []
      };
    }catch(e){
      return structuredClone(defaultData);
    }
  }

  function saveData(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    renderAll();
  }



  function uid(prefix){
    return prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  }

  function normalize(text){
    return String(text || '').trim().replace(/\s+/g,' ');
  }

  function uniquePush(list, value){
    const v = normalize(value);
    if(!v) return;
    const idx = list.findIndex(x => x.toLocaleLowerCase() === v.toLocaleLowerCase());
    if(idx >= 0) list.splice(idx,1);
    list.unshift(v);
    if(list.length > 200) list.length = 200;
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, s => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[s]));
  }

  function showScreen(id){
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.screen === id));
    $('fab').style.display = (id === 'addScreen') ? 'none' : 'block';
    if(id === 'addScreen') setTimeout(() => $('itemName').focus(), 80);
    window.scrollTo({top:0,behavior:'smooth'});
  }

  function storeCount(storeId){
    return data.items.filter(item => item.storeIds.includes(storeId)).length;
  }

  function renderHome(){
    const grid = $('storeGrid');
    grid.innerHTML = '';
    $('noStoreHome').hidden = data.stores.length > 0;

    data.stores.forEach(store => {
      const count = storeCount(store.id);
      const btn = document.createElement('button');
      btn.className = 'store-card';
      btn.innerHTML = `
        <span class="store-name">${escapeHtml(store.name)}</span>
        <span class="store-count">${count}件</span>
      `;
      btn.addEventListener('click', () => openStore(store.id));
      grid.appendChild(btn);
    });
  }

  function itemRow(item, contextStoreId){
    const storeNames = item.storeIds
      .map(id => data.stores.find(s => s.id === id))
      .filter(Boolean)
      .map(s => s.name);

    const row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML = `
      <button class="check-btn" aria-label="購入済み">✓</button>
      <div>
        <div class="item-name">${escapeHtml(item.name)}</div>
        <div class="item-stores">
          ${storeNames.map(name => `<span class="mini-tag">${escapeHtml(name)}</span>`).join('')}
        </div>
      </div>
      <button class="more-btn" aria-label="編集">⋮</button>
    `;
    row.querySelector('.check-btn').addEventListener('click', () => completeItem(item.id, contextStoreId));
    row.querySelector('.more-btn').addEventListener('click', () => openEdit(item.id));
    return row;
  }

  function openStore(storeId){
    currentStoreId = storeId;
    const store = data.stores.find(s => s.id === storeId);
    if(!store) return;
    $('storeScreenTitle').textContent = store.name;
    renderStoreScreen();
    showScreen('storeScreen');
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  }

  function renderStoreScreen(){
    const wrap = $('storeItems');
    wrap.innerHTML = '';
    const items = data.items.filter(item => item.storeIds.includes(currentStoreId));
    $('storeEmpty').hidden = items.length > 0;
    items.forEach(item => wrap.appendChild(itemRow(item, currentStoreId)));
  }

  function renderAllItems(){
    const wrap = $('allItems');
    wrap.innerHTML = '';
    $('allEmpty').hidden = data.items.length > 0;
    data.items.forEach(item => wrap.appendChild(itemRow(item, null)));
  }

  function renderStoreChips(){
    const wrap = $('storeChips');
    wrap.innerHTML = '';
    $('noStoreForm').hidden = data.stores.length > 0;

    data.stores.forEach(store => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chip' + (selectedStoreIds.has(store.id) ? ' selected' : '');
      btn.textContent = store.name;
      btn.addEventListener('click', () => {
        selectedStoreIds.has(store.id) ? selectedStoreIds.delete(store.id) : selectedStoreIds.add(store.id);
        renderStoreChips();
        validateForm();
      });
      wrap.appendChild(btn);
    });
  }

  function validateForm(){
    $('saveItem').disabled = !(normalize($('itemName').value) && selectedStoreIds.size);
  }

  function addStore(name, selectAfter = false){
    const clean = normalize(name);
    if(!clean) return null;

    let store = data.stores.find(s => s.name.toLocaleLowerCase() === clean.toLocaleLowerCase());
    if(!store){
      store = {id:uid('store'), name:clean};
      data.stores.push(store);
    }
    uniquePush(data.storeHistory, clean);
    if(selectAfter) selectedStoreIds.add(store.id);
    saveData();
    return store;
  }

  function addItem(){
    const name = normalize($('itemName').value);
    if(!name || !selectedStoreIds.size) return;

    data.items.push({
      id:uid('item'),
      name,
      storeIds:[...selectedStoreIds],
      createdAt:new Date().toISOString()
    });
    uniquePush(data.itemHistory, name);

    $('itemName').value = '';
    selectedStoreIds.clear();
    saveData();
    validateForm();
    showScreen('homeScreen');
  }

  function completeItem(itemId, contextStoreId){
    const index = data.items.findIndex(i => i.id === itemId);
    if(index < 0) return;
    const [removed] = data.items.splice(index,1);
    lastRemoved = {item:removed,index};
    saveData();

    const storeName = contextStoreId
      ? data.stores.find(s => s.id === contextStoreId)?.name
      : null;
    const suffix = removed.storeIds.length > 1 ? '（他の店舗の一覧からも消えました）' : '';
    showToast(`${removed.name}を購入済みにしました${suffix}`);
  }

  function showToast(text){
    clearTimeout(toastTimer);
    $('toastText').textContent = text;
    $('toast').classList.remove('hidden');
    toastTimer = setTimeout(() => {
      $('toast').classList.add('hidden');
      lastRemoved = null;
    }, 5500);
  }

  function undo(){
    if(!lastRemoved) return;
    data.items.splice(lastRemoved.index,0,lastRemoved.item);
    lastRemoved = null;
    $('toast').classList.add('hidden');
    saveData();
  }

  function openEdit(itemId){
    const item = data.items.find(i => i.id === itemId);
    if(!item) return;
    editingItemId = itemId;
    $('editName').value = item.name;
    renderEditChips(item.storeIds);
    $('editDialog').showModal();
  }

  function renderEditChips(selected){
    const selectedSet = new Set(selected);
    const wrap = $('editStoreChips');
    wrap.innerHTML = '';

    data.stores.forEach(store => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chip' + (selectedSet.has(store.id) ? ' selected' : '');
      btn.textContent = store.name;
      btn.dataset.id = store.id;
      btn.addEventListener('click', () => btn.classList.toggle('selected'));
      wrap.appendChild(btn);
    });
  }

  function updateItem(){
    const item = data.items.find(i => i.id === editingItemId);
    if(!item) return;
    const name = normalize($('editName').value);
    const storeIds = [...$('editStoreChips').querySelectorAll('.chip.selected')].map(b => b.dataset.id);
    if(!name || !storeIds.length){
      alert('商品名と店舗を1つ以上選択してください。');
      return;
    }
    item.name = name;
    item.storeIds = storeIds;
    uniquePush(data.itemHistory, name);
    $('editDialog').close();
    saveData();
  }

  function deleteEditingItem(){
    const index = data.items.findIndex(i => i.id === editingItemId);
    if(index < 0) return;
    const item = data.items[index];
    if(!confirm(`「${item.name}」を削除しますか？`)) return;
    data.items.splice(index,1);
    $('editDialog').close();
    saveData();
  }

  function renderStoreManager(){
    const wrap = $('manageStoreList');
    wrap.innerHTML = '';
    if(!data.stores.length){
      wrap.innerHTML = '<div class="empty">登録されている店舗はありません。</div>';
      return;
    }

    data.stores.forEach(store => {
      const row = document.createElement('div');
      row.className = 'store-manage-row';
      row.dataset.storeId = store.id;
      row.draggable = true;
      row.innerHTML = `
        <button class="drag-handle" aria-label="ドラッグして並べ替え" title="ドラッグして並べ替え">☰</button>
        <div class="store-manage-name">${escapeHtml(store.name)}</div>
        <button class="small-btn edit-store">名称変更</button>
        <button class="small-btn danger delete-store">削除</button>
      `;
      row.querySelector('.edit-store').addEventListener('click', () => renameStore(store.id));
      row.querySelector('.delete-store').addEventListener('click', () => deleteStore(store.id));
      wrap.appendChild(row);
    });

    enableStoreReordering(wrap);
  }

  function enableStoreReordering(wrap){
    let draggedId = null;
    let touchSourceId = null;
    let touchRow = null;

    wrap.querySelectorAll('.store-manage-row').forEach(row => {
      row.addEventListener('dragstart', e => {
        draggedId = row.dataset.storeId;
        row.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', draggedId);
      });

      row.addEventListener('dragend', () => {
        row.classList.remove('dragging');
        wrap.querySelectorAll('.store-manage-row').forEach(r => r.classList.remove('drag-over'));
        draggedId = null;
      });

      row.addEventListener('dragover', e => {
        e.preventDefault();
        if(draggedId && draggedId !== row.dataset.storeId){
          wrap.querySelectorAll('.store-manage-row').forEach(r => r.classList.remove('drag-over'));
          row.classList.add('drag-over');
        }
      });

      row.addEventListener('drop', e => {
        e.preventDefault();
        const sourceId = draggedId || e.dataTransfer.getData('text/plain');
        const targetId = row.dataset.storeId;
        reorderStores(sourceId, targetId);
      });

      const handle = row.querySelector('.drag-handle');

      handle.addEventListener('pointerdown', e => {
        if(e.pointerType === 'mouse') return;
        touchSourceId = row.dataset.storeId;
        touchRow = row;
        row.classList.add('dragging');
        handle.setPointerCapture(e.pointerId);
        e.preventDefault();
      });

      handle.addEventListener('pointermove', e => {
        if(!touchSourceId) return;
        const target = document.elementFromPoint(e.clientX, e.clientY)?.closest('.store-manage-row');
        wrap.querySelectorAll('.store-manage-row').forEach(r => r.classList.remove('drag-over'));
        if(target && target.dataset.storeId !== touchSourceId){
          target.classList.add('drag-over');
        }
      });

      const finishTouchDrag = e => {
        if(!touchSourceId) return;
        const target = document.elementFromPoint(e.clientX, e.clientY)?.closest('.store-manage-row');
        const sourceId = touchSourceId;

        touchRow?.classList.remove('dragging');
        wrap.querySelectorAll('.store-manage-row').forEach(r => r.classList.remove('drag-over'));

        touchSourceId = null;
        touchRow = null;

        if(target && target.dataset.storeId !== sourceId){
          reorderStores(sourceId, target.dataset.storeId);
        }
      };

      handle.addEventListener('pointerup', finishTouchDrag);
      handle.addEventListener('pointercancel', finishTouchDrag);
    });
  }

  function reorderStores(sourceId, targetId){
    if(!sourceId || !targetId || sourceId === targetId) return;

    const sourceIndex = data.stores.findIndex(store => store.id === sourceId);
    const targetIndex = data.stores.findIndex(store => store.id === targetId);
    if(sourceIndex < 0 || targetIndex < 0) return;

    const [movedStore] = data.stores.splice(sourceIndex, 1);
    data.stores.splice(targetIndex, 0, movedStore);
    saveData();
  }

  function renameStore(storeId){
    const store = data.stores.find(s => s.id === storeId);
    if(!store) return;
    const next = normalize(prompt('新しい店舗名を入力してください。', store.name));
    if(!next || next === store.name) return;
    if(data.stores.some(s => s.id !== storeId && s.name.toLocaleLowerCase() === next.toLocaleLowerCase())){
      alert('同じ名前の店舗がすでにあります。');
      return;
    }
    store.name = next;
    uniquePush(data.storeHistory,next);
    saveData();
  }

  function deleteStore(storeId){
    const store = data.stores.find(s => s.id === storeId);
    if(!store) return;
    const affected = storeCount(storeId);
    const message = affected
      ? `本当に「${store.name}」を削除しますか？\n\nこの店舗だけに登録されている商品は、買物メモからも削除されます。\nこの操作は、バックアップから復元しない限り元に戻せません。`
      : `本当に「${store.name}」を削除しますか？\n\n削除後も、必要になれば店舗管理から再登録できます。`;
    if(!confirm(message)) return;

    data.stores = data.stores.filter(s => s.id !== storeId);
    data.items = data.items
      .map(item => ({...item, storeIds:item.storeIds.filter(id => id !== storeId)}))
      .filter(item => item.storeIds.length > 0);
    selectedStoreIds.delete(storeId);
    saveData();
  }

  function renderSuggestions(input, box, source, onChoose){
    const q = normalize(input.value).toLocaleLowerCase();
    box.innerHTML = '';
    if(!q){
      box.classList.add('hidden');
      return;
    }
    const matches = source
      .filter(v => v.toLocaleLowerCase().startsWith(q))
      .slice(0,8);

    if(!matches.length){
      box.classList.add('hidden');
      return;
    }
    matches.forEach(value => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'suggestion';
      btn.textContent = value;
      btn.addEventListener('click', () => {
        onChoose(value);
        box.classList.add('hidden');
      });
      box.appendChild(btn);
    });
    box.classList.remove('hidden');
  }

  function saveBackup(){
    try{
      const backup = {
        version:1,
        savedAt:new Date().toISOString(),
        data:JSON.parse(JSON.stringify(data))
      };
      localStorage.setItem(BACKUP_KEY, JSON.stringify(backup));
      renderBackupStatus();
      alert('現在の状態をバックアップしました。前回のバックアップは上書きされました。');
    }catch(e){
      alert('バックアップを保存できませんでした。');
    }
  }

  function restoreBackup(){
    const raw = localStorage.getItem(BACKUP_KEY);
    if(!raw){
      alert('復元できるバックアップがありません。');
      return;
    }
    try{
      const backup = JSON.parse(raw);
      const restored = backup.data;
      if(!restored || !Array.isArray(restored.stores) || !Array.isArray(restored.items)){
        throw new Error('invalid backup');
      }
      if(!confirm('現在のデータをバックアップ時点の内容に戻しますか？')) return;
      data = {
        stores:restored.stores,
        items:restored.items,
        itemHistory:Array.isArray(restored.itemHistory) ? restored.itemHistory : [],
        storeHistory:Array.isArray(restored.storeHistory) ? restored.storeHistory : []
      };
      selectedStoreIds.clear();
      saveData();
      alert('バックアップから復元しました。');
    }catch(e){
      alert('バックアップデータを読み込めませんでした。');
    }
  }

  function renderBackupStatus(){
    const status = $('backupStatus');
    if(!status) return;
    const raw = localStorage.getItem(BACKUP_KEY);
    if(!raw){
      status.textContent = '現在、バックアップはありません。';
      return;
    }
    try{
      const backup = JSON.parse(raw);
      const d = new Date(backup.savedAt);
      status.textContent = `最終バックアップ：${d.toLocaleString('ja-JP')}`;
    }catch(e){
      status.textContent = 'バックアップ情報を確認できません。';
    }
  }

  function renderAll(){
    $('headerCount').textContent = `${data.items.length}件`;
    renderHome();
    renderStoreScreen();
    renderAllItems();
    renderStoreChips();
    renderStoreManager();
    renderBackupStatus();
  }

  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => showScreen(btn.dataset.screen));
  });

  $('fab').addEventListener('click', () => showScreen('addScreen'));
  $('backHome').addEventListener('click', () => showScreen('homeScreen'));
  $('saveItem').addEventListener('click', addItem);
  $('itemName').addEventListener('input', () => {
    validateForm();
    renderSuggestions($('itemName'), $('itemSuggestions'), data.itemHistory, value => {
      $('itemName').value = value;
      validateForm();
    });
  });

  $('newStoreName').addEventListener('input', () => {
    renderSuggestions($('newStoreName'), $('storeSuggestions'), data.storeHistory, value => {
      $('newStoreName').value = value;
    });
  });

  $('addStoreInline').addEventListener('click', () => {
    const store = addStore($('newStoreName').value, true);
    if(store){
      $('newStoreName').value = '';
      $('storeSuggestions').classList.add('hidden');
      validateForm();
    }
  });

  $('manageStoreAdd').addEventListener('click', () => {
    const store = addStore($('manageStoreInput').value, false);
    if(store) $('manageStoreInput').value = '';
  });

  $('manageStoreInput').addEventListener('keydown', e => {
    if(e.key === 'Enter') $('manageStoreAdd').click();
  });
  $('newStoreName').addEventListener('keydown', e => {
    if(e.key === 'Enter') $('addStoreInline').click();
  });
  $('itemName').addEventListener('keydown', e => {
    if(e.key === 'Enter' && !$('saveItem').disabled) addItem();
  });

  $('undoBtn').addEventListener('click', undo);
  $('updateItemBtn').addEventListener('click', updateItem);
  $('deleteItemBtn').addEventListener('click', deleteEditingItem);
  $('closeDialogBtn').addEventListener('click', () => $('editDialog').close());

  $('saveBackupBtn').addEventListener('click', saveBackup);
  $('restoreBackupBtn').addEventListener('click', restoreBackup);

  document.addEventListener('click', e => {
    if(!e.target.closest('.field')){
      $('itemSuggestions').classList.add('hidden');
      $('storeSuggestions').classList.add('hidden');
    }
  });

  renderAll();
})();
</script>
</body>
</html>
